name: Publish to WinGet
on:
  release:
    types: [released]
jobs:
  publish:
    runs-on: windows-latest # action can only be run on windows
    # Only ever publish from the upstream repository. Without this guard a
    # release cut on a fork would attempt to push to the public
    # `Balena.Etcher` WinGet manifest.
    if: github.repository == 'balena-io/etcher'
    steps:
      - uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: Balena.Etcher
          # matches something like "balenaEtcher-1.19.0.Setup.exe"
          installers-regex: 'balenaEtcher-[\d.-]+\.Setup.exe$'
          token: ${{ secrets.WINGET_PAT }}
